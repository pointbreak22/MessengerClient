@if (update.updateAvailable()) {
  <div class="fixed inset-x-0 bottom-0 z-[60] flex justify-center px-4 pb-4 sm:justify-end sm:pr-6">
    <div
      class="flex w-full max-w-sm items-center gap-3
             rounded-2xl border border-border-strong
             bg-surface-elevated p-4
             shadow-2xl shadow-black/30"
    >
      <div
        class="flex h-9 w-9 shrink-0 items-center justify-center
               rounded-xl bg-gradient-to-br
               from-accent-500 to-accent2-500
               text-white"
      >
        <svg appIcon="refresh" class="h-4 w-4"></svg>
      </div>

      <div class="min-w-0 flex-1">
        <p class="text-xs font-semibold text-foreground">Update available</p>
        <p class="mt-0.5 text-[11px] text-faint-foreground">Reload to get the latest version.</p>
      </div>

      <button
        (click)="reload()"
        class="shrink-0 rounded-lg bg-accent-500 px-3 py-1.5
               text-xs font-semibold text-white
               transition hover:bg-accent-400"
      >
        Reload
      </button>
    </div>
  </div>
}
