<div class="w-64 rounded-2xl border border-border bg-surface-elevated p-3 shadow-2xl shadow-black/30">
  @for (cat of categories; track cat.label) {
    <p class="mb-1.5 px-0.5 text-[10px] font-semibold uppercase tracking-wider text-faint-foreground">
      {{ cat.label }}
    </p>
    <div class="mb-3 grid grid-cols-8 gap-0.5 last:mb-0">
      @for (emoji of cat.emojis; track emoji) {
        <button
          type="button"
          (click)="select(emoji)"
          class="grid h-7 w-7 place-items-center rounded-lg text-base transition hover:bg-surface-hover"
        >
          {{ emoji }}
        </button>
      }
    </div>
  }
</div>
