<header
  class="h-16 shrink-0 border-b border-border
         bg-surface"
>
  <div class="flex h-full items-center px-3 md:px-5">

    <!-- Logo -->
    <div class="flex shrink-0 items-center gap-3 md:w-[260px]">

      <img
        src="/logo-192.png"
        alt="PBMessenger"
        class="h-9 w-9 rounded-xl object-cover shadow-lg shadow-accent-500/20"
      />

      <span class="whitespace-nowrap text-[clamp(11px,4vw,15px)] font-semibold tracking-tight">
        PBMessenger
      </span>
    </div>

    <!-- Search -->
    <div class="hidden min-w-0 flex-1 md:flex">

      <div class="relative w-full max-w-xl">

        <svg
          appIcon="search"
          class="absolute left-3 top-1/2 h-4 w-4
                 -translate-y-1/2 text-faint-foreground"
        ></svg>

        <input
          type="text"
          placeholder="Search messages, people..."
          class="h-10 w-full rounded-xl
                 border border-border
                 bg-surface-hover
                 pl-10 pr-16
                 text-sm text-foreground
                 outline-none
                 placeholder:text-faint-foreground
                 transition
                 focus:border-accent-500/40"
        />

        <div
          class="absolute right-2 top-1/2
                 -translate-y-1/2
                 rounded-md border border-border
                 px-2 py-1
                 text-[10px] text-faint-foreground"
        >
          ⌘ K
        </div>

      </div>
    </div>

    <!-- Right actions -->
    <div class="ml-auto flex items-center gap-2 md:ml-6">

      <!-- Notifications -->
      <button
        class="relative flex h-9 w-9 items-center justify-center
               rounded-xl text-muted-foreground
               transition hover:bg-surface-hover
               hover:text-foreground"
      >
        <svg appIcon="bell" class="h-[18px] w-[18px]"></svg>

        <span
          class="absolute right-1.5 top-1.5 h-1.5 w-1.5
                 rounded-full bg-accent-500"
        ></span>
      </button>

      <!-- Divider -->
      <div class="mx-2 h-7 w-px bg-border"></div>

      <!-- User -->
      <div class="relative">
        <button
          (click)="toggleProfileMenu()"
          class="flex items-center gap-3 rounded-xl px-2 py-1.5
                 transition hover:bg-surface-hover"
        >

          <div class="relative shrink-0">
            <app-avatar
              [name]="currentUser()?.userName"
              [avatarUrl]="currentUser()?.avatarUrl"
              sizeClass="h-8 w-8"
              textClass="text-xs font-semibold"
              colorClass="bg-gradient-to-br from-accent-400 to-accent2-400 text-white"
            />
            <span
              class="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5
                     rounded-full border-2 border-surface bg-online"
            ></span>
          </div>

          <div class="hidden text-left sm:block">
            <div class="text-xs font-medium text-foreground">
              {{ currentUser()?.userName }}
            </div>
          </div>

          <svg appIcon="chevron-down" class="h-4 w-4 text-faint-foreground"></svg>

        </button>

        @if (showProfileMenu()) {
          <button
            (click)="closeProfileMenu()"
            class="fixed inset-0 z-40 cursor-default"
            aria-label="Close menu"
          ></button>

          <div
            class="absolute right-0 top-full z-50 mt-2 w-64
                   rounded-2xl border border-border
                   bg-surface-elevated p-4
                   shadow-2xl shadow-black/30"
          >
            <input
              #avatarFileInput
              type="file"
              accept="image/jpeg,image/png,image/gif,image/webp"
              class="hidden"
              (change)="onAvatarSelected($event)"
            />

            <div class="flex flex-col items-center">
              <app-avatar
                [name]="currentUser()?.userName"
                [avatarUrl]="currentUser()?.avatarUrl"
                sizeClass="h-16 w-16"
                textClass="text-lg font-semibold"
                colorClass="bg-gradient-to-br from-accent-500/30 to-accent2-500/30 text-accent-400"
              />

              <div class="mt-3 flex gap-2">
                <button
                  (click)="triggerAvatarUpload()"
                  [disabled]="uploadingAvatar()"
                  class="rounded-lg border border-border bg-surface-alt px-2.5 py-1
                         text-[11px] font-medium text-foreground
                         transition hover:bg-surface-hover
                         disabled:cursor-not-allowed disabled:opacity-40"
                >
                  Change avatar
                </button>
                @if (currentUser()?.avatarUrl) {
                  <button
                    (click)="removeAvatar()"
                    [disabled]="uploadingAvatar()"
                    class="rounded-lg border border-border bg-surface-alt px-2.5 py-1
                           text-[11px] font-medium text-danger
                           transition hover:bg-surface-hover
                           disabled:cursor-not-allowed disabled:opacity-40"
                  >
                    Remove
                  </button>
                }
              </div>
            </div>

            <div class="mt-4 border-t border-border pt-3">
              @if (editingName()) {
                <input
                  type="text"
                  [value]="nameDraft()"
                  (input)="onNameDraftInput($event)"
                  class="mb-2 h-9 w-full rounded-lg border border-border
                         bg-surface px-3
                         text-xs text-foreground outline-none
                         placeholder:text-faint-foreground
                         transition focus:border-accent-500/40"
                />
                <div class="flex gap-2">
                  <button
                    (click)="saveName()"
                    [disabled]="savingName() || !nameDraft().trim()"
                    class="flex-1 rounded-lg bg-accent-500 py-1.5
                           text-[11px] font-semibold text-white
                           transition hover:bg-accent-400
                           disabled:cursor-not-allowed disabled:opacity-40"
                  >
                    Save
                  </button>
                  <button
                    (click)="cancelEditName()"
                    class="flex-1 rounded-lg border border-border py-1.5
                           text-[11px] font-medium text-foreground
                           transition hover:bg-surface-hover"
                  >
                    Cancel
                  </button>
                </div>
              } @else {
                <div class="flex items-center justify-between gap-2">
                  <p class="truncate text-xs font-medium text-foreground">{{ currentUser()?.userName }}</p>
                  <button
                    (click)="startEditName()"
                    class="shrink-0 text-[11px] font-medium text-accent-400 transition hover:text-accent-500"
                  >
                    Edit
                  </button>
                </div>
              }
            </div>
          </div>
        }
      </div>

      <button
        (click)="signOut()"
        title="Sign out"
        class="flex h-9 w-9 items-center justify-center
               rounded-xl text-faint-foreground
               transition hover:bg-surface-hover hover:text-foreground"
      >
        <svg appIcon="logout" class="h-4 w-4"></svg>
      </button>

    </div>

  </div>
</header>
