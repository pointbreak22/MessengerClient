<header
  class="h-16 shrink-0 border-b border-border
         bg-surface"
>
  <div class="flex h-full items-center px-5">

    <!-- Logo -->
    <div class="flex w-[260px] shrink-0 items-center gap-3">

      <div
        class="flex h-9 w-9 items-center justify-center
               rounded-xl bg-gradient-to-br
               from-accent-500 to-accent2-500
               shadow-lg shadow-accent-500/20"
      >
        <svg appIcon="message" class="h-5 w-5 text-white"></svg>
      </div>

      <span class="text-[15px] font-semibold tracking-tight">
        Messenger
      </span>
    </div>

    <!-- Search -->
    <div class="flex min-w-0 flex-1">

      <div class="relative w-full max-w-xl">

        <svg
          appIcon="search"
          class="absolute left-3 top-1/2 h-4 w-4
                 -translate-y-1/2 text-faint-foreground"
        ></svg>

        <input
          type="text"
          placeholder="Search messages, people..."
          class="h-10 w-full rounded-xl
                 border border-border
                 bg-surface-hover
                 pl-10 pr-16
                 text-sm text-foreground
                 outline-none
                 placeholder:text-faint-foreground
                 transition
                 focus:border-accent-500/40"
        />

        <div
          class="absolute right-2 top-1/2
                 -translate-y-1/2
                 rounded-md border border-border
                 px-2 py-1
                 text-[10px] text-faint-foreground"
        >
          ⌘ K
        </div>

      </div>
    </div>

    <!-- Right actions -->
    <div class="ml-6 flex items-center gap-2">

      <!-- Notifications -->
      <button
        class="relative flex h-9 w-9 items-center justify-center
               rounded-xl text-muted-foreground
               transition hover:bg-surface-hover
               hover:text-foreground"
      >
        <svg appIcon="bell" class="h-[18px] w-[18px]"></svg>

        <span
          class="absolute right-1.5 top-1.5 h-1.5 w-1.5
                 rounded-full bg-accent-500"
        ></span>
      </button>

      <!-- Divider -->
      <div class="mx-2 h-7 w-px bg-border"></div>

      <!-- User -->
      <button
        class="flex items-center gap-3 rounded-xl px-2 py-1.5
               transition hover:bg-surface-hover"
      >

        <div class="relative shrink-0">
          <div
            class="flex h-8 w-8 items-center justify-center
                   rounded-full bg-gradient-to-br
                   from-accent-400 to-accent2-400
                   text-xs font-semibold text-white"
          >
            {{ currentUser.initials }}
          </div>
          <span
            class="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5
                   rounded-full border-2 border-surface bg-online"
          ></span>
        </div>

        <div class="hidden text-left sm:block">
          <div class="text-xs font-medium text-foreground">
            {{ currentUser.name }}
          </div>
          <div class="text-[10px] text-faint-foreground">
            {{ currentUser.role }}
          </div>
        </div>

        <svg appIcon="chevron-down" class="h-4 w-4 text-faint-foreground"></svg>

      </button>

      <a
        routerLink="/login"
        title="Sign out"
        class="flex h-9 w-9 items-center justify-center
               rounded-xl text-faint-foreground
               transition hover:bg-surface-hover hover:text-foreground"
      >
        <svg appIcon="logout" class="h-4 w-4"></svg>
      </a>

    </div>

  </div>
</header>
