<div
  class="relative flex min-h-screen
         items-center justify-center
         overflow-hidden bg-background
         px-4 text-foreground"
>

  <!-- Background -->
  <div class="pointer-events-none absolute inset-0 overflow-hidden">

    <div
      class="absolute left-1/2 top-[-300px]
             h-[600px] w-[600px]
             -translate-x-1/2
             rounded-full
             bg-accent-500/[0.08]
             blur-[120px]"
    ></div>

    <div
      class="absolute bottom-[-300px] right-[-150px]
             h-[500px] w-[500px]
             rounded-full
             bg-accent2-500/[0.05]
             blur-[120px]"
    ></div>

    <div
      class="absolute inset-0
             bg-[radial-gradient(circle_at_center,rgba(255,255,255,0.025)_1px,transparent_1px)]
             [background-size:24px_24px]
             opacity-30"
    ></div>

  </div>

  <!-- Card -->
  <div class="relative z-10 w-full max-w-[420px]">

    <!-- Logo -->
    <div class="mb-8 flex flex-col items-center">

      <div
        class="flex h-12 w-12 items-center justify-center
               rounded-2xl bg-gradient-to-br
               from-accent-500 to-accent2-500
               shadow-xl shadow-accent-500/20"
      >
        <svg appIcon="message" class="h-6 w-6 text-white"></svg>
      </div>

      <h1 class="mt-5 text-xl font-semibold tracking-tight">Create your account</h1>
      <p class="mt-2 text-sm text-faint-foreground">Join Messenger and start chatting</p>

    </div>

    <!-- Form -->
    <div
      class="rounded-2xl
             border border-border
             bg-surface-elevated
             p-6
             shadow-2xl shadow-black/30"
    >

      <!-- Full name -->
      <div>
        <label class="mb-2 block text-xs font-medium text-muted-foreground">Full name</label>
        <div class="relative">
          <svg
            appIcon="user"
            class="absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-faint-foreground"
          ></svg>
          <input
            [(ngModel)]="fullName"
            name="fullName"
            type="text"
            placeholder="Jane Cooper"
            class="h-11 w-full rounded-xl
                   border border-border
                   bg-surface-hover pl-10 pr-4
                   text-sm text-foreground outline-none
                   placeholder:text-faint-foreground
                   transition
                   focus:border-accent-500/50"
          />
        </div>
      </div>

      <!-- Email -->
      <div class="mt-5">
        <label class="mb-2 block text-xs font-medium text-muted-foreground">Email</label>
        <div class="relative">
          <svg
            appIcon="mail"
            class="absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-faint-foreground"
          ></svg>
          <input
            [(ngModel)]="email"
            name="email"
            type="email"
            placeholder="you@example.com"
            class="h-11 w-full rounded-xl
                   border border-border
                   bg-surface-hover pl-10 pr-4
                   text-sm text-foreground outline-none
                   placeholder:text-faint-foreground
                   transition
                   focus:border-accent-500/50"
          />
        </div>
      </div>

      <!-- Password -->
      <div class="mt-5">
        <label class="mb-2 block text-xs font-medium text-muted-foreground">Password</label>
        <div class="relative">
          <svg
            appIcon="lock"
            class="absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-faint-foreground"
          ></svg>
          <input
            [(ngModel)]="password"
            name="password"
            type="password"
            placeholder="Create a password"
            class="h-11 w-full rounded-xl
                   border border-border
                   bg-surface-hover pl-10 pr-4
                   text-sm text-foreground outline-none
                   placeholder:text-faint-foreground
                   transition
                   focus:border-accent-500/50"
          />
        </div>
      </div>

      <!-- Confirm password -->
      <div class="mt-5">
        <label class="mb-2 block text-xs font-medium text-muted-foreground">Confirm password</label>
        <div class="relative">
          <svg
            appIcon="lock"
            class="absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-faint-foreground"
          ></svg>
          <input
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            type="password"
            placeholder="Repeat your password"
            class="h-11 w-full rounded-xl
                   border border-border
                   bg-surface-hover pl-10 pr-4
                   text-sm text-foreground outline-none
                   placeholder:text-faint-foreground
                   transition
                   focus:border-accent-500/50"
          />
        </div>
      </div>

      <!-- Terms -->
      <label class="mt-5 flex cursor-pointer items-center gap-2">
        <input
          [(ngModel)]="agreeTerms"
          name="agreeTerms"
          type="checkbox"
          class="h-4 w-4 rounded border-border-strong bg-surface-hover accent-accent-500"
        />
        <span class="text-xs text-muted-foreground">I agree to the Terms and Privacy Policy</span>
      </label>

      <!-- Submit -->
      <button
        type="button"
        (click)="submit()"
        [disabled]="!agreeTerms"
        class="mt-6 h-11 w-full rounded-xl
               bg-accent-500
               text-sm font-medium text-white
               shadow-lg shadow-accent-500/20
               transition
               hover:bg-accent-400
               active:scale-[0.99]
               disabled:cursor-not-allowed disabled:opacity-40"
      >
        Create account
      </button>

      <!-- Divider -->
      <div class="my-6 flex items-center gap-3">
        <div class="h-px flex-1 bg-border"></div>
        <span class="text-[10px] text-faint-foreground">OR</span>
        <div class="h-px flex-1 bg-border"></div>
      </div>

      <!-- Google -->
      <button
        type="button"
        class="flex h-11 w-full items-center
               justify-center gap-3 rounded-xl
               border border-border
               bg-surface-hover
               text-sm font-medium text-muted-foreground
               transition hover:bg-surface-alt"
      >
        <span class="text-base font-bold">G</span>
        Continue with Google
      </button>

    </div>

    <p class="mt-6 text-center text-xs text-muted-foreground">
      Already have an account?
      <a routerLink="/login" class="font-medium text-accent-400 hover:text-accent-500">Sign in</a>
    </p>

    <p class="mt-6 text-center text-[11px] text-faint-foreground">© 2026 Messenger</p>

  </div>

</div>
