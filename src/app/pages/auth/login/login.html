<div
  class="relative flex min-h-dvh
         items-center justify-center
         overflow-hidden bg-background
         px-4 text-foreground"
>

  <!-- Background -->
  <div
    class="pointer-events-none absolute inset-0
           overflow-hidden"
  >

    <div
      class="absolute left-1/2 top-[-300px]
             h-[600px] w-[600px]
             -translate-x-1/2
             rounded-full
             bg-accent-500/[0.08]
             blur-[120px]"
    ></div>

    <div
      class="absolute bottom-[-300px] right-[-150px]
             h-[500px] w-[500px]
             rounded-full
             bg-accent2-500/[0.05]
             blur-[120px]"
    ></div>

    <div
      class="absolute inset-0
             bg-[radial-gradient(circle_at_center,
             rgba(255,255,255,0.025)_1px,
             transparent_1px)]
             [background-size:24px_24px]
             opacity-30"
    ></div>

  </div>

  <!-- Card -->
  <div class="relative z-10 w-full max-w-[420px]">

    <!-- Logo -->
    <div class="mb-8 flex flex-col items-center">

      <div
        class="flex h-12 w-12 items-center justify-center
               rounded-2xl
               bg-gradient-to-br
               from-accent-500 to-accent2-500
               shadow-xl shadow-accent-500/20"
      >
        <svg appIcon="message" class="h-6 w-6 text-white"></svg>
      </div>

      <h1 class="mt-5 text-xl font-semibold tracking-tight">
        Welcome back
      </h1>

      <p class="mt-2 text-sm text-faint-foreground">
        Sign in to continue to Messenger
      </p>

    </div>

    <!-- Card -->
    <div
      class="rounded-2xl
             border border-border
             bg-surface-elevated
             p-6
             shadow-2xl shadow-black/30"
    >

      <button
        type="button"
        (click)="signIn()"
        class="flex h-11 w-full items-center
               justify-center gap-2 rounded-xl
               bg-accent-500
               text-sm font-medium text-white
               shadow-lg shadow-accent-500/20
               transition
               hover:bg-accent-400
               active:scale-[0.99]"
      >
        Sign in with Microsoft
      </button>

      <p class="mt-4 text-center text-xs text-muted-foreground">
        New here? The sign-in screen also lets you create an account.
      </p>

    </div>

    <p class="mt-6 text-center text-[11px] text-faint-foreground">
      © 2026 Messenger
    </p>

  </div>

</div>
