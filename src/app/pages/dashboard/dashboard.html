<div class="flex h-screen flex-col overflow-hidden bg-background text-foreground">

  <app-header />

  <div class="flex min-h-0 flex-1">

    <app-left-sidebar />

    <main class="flex min-w-0 flex-1 flex-col overflow-hidden bg-surface-alt">
      @if (selectedChat()) {
        <app-chat />
      } @else {
        <div class="flex flex-1 flex-col items-center justify-center px-6 text-center">
          <div
            class="flex h-16 w-16 items-center justify-center
                   rounded-2xl bg-gradient-to-br
                   from-accent-500 to-accent2-500
                   shadow-xl shadow-accent-500/20"
          >
            <svg appIcon="message" class="h-8 w-8 text-white"></svg>
          </div>
          <h2 class="mt-5 text-lg font-semibold text-foreground">Select a conversation</h2>
          <p class="mt-2 max-w-xs text-sm text-faint-foreground">
            Choose a chat, group or friend from the left to start messaging.
          </p>
        </div>
      }
    </main>

    <app-right-sidebar />

  </div>

</div>
